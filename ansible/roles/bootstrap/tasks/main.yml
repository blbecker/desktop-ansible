---
- name: Create Ansible service account
  become: true
  ansible.builtin.user:
    name: ansible
    system: true
    create_home: true
    home: /var/lib/ansible
    shell: /usr/sbin/nologin
    password: "!"

- name: Configure passwordless sudo for Ansible
  become: true
  ansible.builtin.copy:
    dest: /etc/sudoers.d/ansible
    content: |
      ansible ALL=(ALL:ALL) NOPASSWD: ALL
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Install ansible-core
  become: true
  ansible.builtin.apt:
    name: ansible-core
    state: present
    update_cache: true
    cache_valid_time: 86400

- name: Install ansible-pull systemd service
  become: true
  ansible.builtin.template:
    src: ansible-pull.service.j2
    dest: /etc/systemd/system/ansible-pull.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install ansible-pull systemd timer
  become: true
  ansible.builtin.template:
    src: ansible-pull.timer.j2
    dest: /etc/systemd/system/ansible-pull.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Apply pending systemd changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start ansible-pull timer
  become: true
  ansible.builtin.systemd_service:
    name: ansible-pull.timer
    enabled: true
    state: started
