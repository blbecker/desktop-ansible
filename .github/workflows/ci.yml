---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    name: Prek checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Ansible Galaxy requirements
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r "${GITHUB_WORKSPACE}/ansible/requirements.txt"
          .venv/bin/ansible-galaxy install -r "${GITHUB_WORKSPACE}/ansible/requirements.yml"

      - name: Run prek
        uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
